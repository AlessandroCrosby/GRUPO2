<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Camera Preview</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background-color: black;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline></video>
    <script>
      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          document.getElementById("video").srcObject = stream;
        } catch (e) {
          document.body.innerHTML = "<p style='color:white;text-align:center;margin-top:40%;'>Error: " + e.message + "</p>";
        }
      }
      startCamera();
    </script>
  </body>
</html>
